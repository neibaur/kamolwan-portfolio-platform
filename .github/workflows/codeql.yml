# CodeQL, as a workflow ("advanced setup").
#
# This replaces GitHub's default setup for this repository. Default setup does
# not analyse pull requests opened by Dependabot, and the ruleset on `main`
# requires the `Analyze (actions)` check, so every Dependabot pull request was
# blocked waiting for a check that never ran. A workflow runs for them too.
#
# Default setup must be switched off in the repository settings before this
# workflow can upload results. The job name and the category below match what
# default setup reported, so the required check and the alert history carry on.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: ["actions"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
